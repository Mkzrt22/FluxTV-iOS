# Projet Xcode de FluxTV (iPhone, iPad, Apple TV), généré par XcodeGen.
name: FluxTV
options:
  bundleIdPrefix: bzh.fluxtv
  developmentLanguage: fr
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  FluxTV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/tvOS.xcassets"
      - path: Core/Sources/FluxCore
        group: Core
    dependencies:
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: FluxTV
        PRODUCT_BUNDLE_IDENTIFIER: bzh.fluxtv.player
        INFOPLIST_FILE: Config/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  FluxTV TV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Resources/iOS.xcassets"
      - path: Core/Sources/FluxCore
        group: Core
    dependencies:
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: FluxTV
        PRODUCT_BUNDLE_IDENTIFIER: bzh.fluxtv.player
        INFOPLIST_FILE: Config/Info-tvOS.plist
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  FluxTV:
    build:
      targets:
        FluxTV: all
    run:
      config: Debug
    archive:
      config: Release
  FluxTV TV:
    build:
      targets:
        FluxTV TV: all
    run:
      config: Debug
    archive:
      config: Release
