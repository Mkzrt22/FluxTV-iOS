# Préparation de la fiche App Store, sur des Mac de GitHub. Rien n'est envoyé à Apple.
#  - captures d'écran aux tailles demandées par Apple (iPhone 6,9", iPad 13", Apple TV), en français
#    et en anglais, avec la démonstration ;
#  - archives App Store non signées et contrôles (version, icônes, moteur VLC, aucun compte intégré),
#    puis tests du cœur de l'app (tests-coeur.txt).
# Résultat : branche « ci-appstore ». Lancement : envoi sur la branche « appstore » ou « Run workflow ».
# « [sans captures] » ou « [sans verification] » dans le message du commit : partie sautée (le
# résultat précédent reste sur la branche).
name: App Store - préparation
on:
  push:
    branches: [appstore]
    paths-ignore: ["AppStore/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: appstore-preparation
  cancel-in-progress: true
jobs:
  captures:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[sans captures]') }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Captures d'écran
        run: .github/appstore-captures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: appstore/captures
          retention-days: 7
  verification:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[sans verification]') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Archives App Store non signées et contrôles
        run: .github/appstore-archive.sh verifier
      - name: Tests du cœur
        if: always()
        run: |
          mkdir -p appstore/verification
          cd Core
          swift test > ../appstore/verification/tests-coeur.txt 2>&1 || { tail -40 ../appstore/verification/tests-coeur.txt; exit 1; }
          tail -3 ../appstore/verification/tests-coeur.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: appstore/verification
          retention-days: 7
  publication:
    needs: [captures, verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: nouveau
      - name: Publication sur la branche ci-appstore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          depot="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # On garde le résultat précédent des parties sautées
          git clone -q --depth 1 -b ci-appstore "$depot" appstore 2>/dev/null || { mkdir appstore && git -C appstore init -q -b ci-appstore; }
          for d in captures verification; do
            if [ -d "nouveau/$d" ]; then rm -rf "appstore/$d"; cp -R "nouveau/$d" "appstore/$d"; fi
          done
          cd appstore
          {
            echo "commit: $GITHUB_SHA"
            echo "captures: ${{ needs.captures.result }}"
            echo "verification: ${{ needs.verification.result }}"
          } > resultat.txt
          # Un seul commit, sans historique : la branche ne grossit pas d'une exécution à l'autre
          git checkout -q --orphan publication
          git add -A
          git -c user.name="FluxTV CI" -c user.email="ci@fluxtv.invalid" commit -qm "App Store $GITHUB_SHA"
          git push -qf "$depot" HEAD:ci-appstore
